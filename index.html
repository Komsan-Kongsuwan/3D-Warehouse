<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DEMO Warehouse · 3D View</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
    --bg-deep:    #080c10;
    --bg-panel:   #0d1520;
    --bg-card:    #111c2a;
    --bg-hover:   #162235;
    --border:     #1e3048;
    --border-lit: #1e4a6e;
    --cyan:       #00c8ff;
    --cyan-dim:   #006a88;
    --cyan-glow:  rgba(0,200,255,0.15);
    --amber:      #ffaa00;
    --amber-dim:  #7a5000;
    --green:      #00e676;
    --green-dim:  #005c2e;
    --red:        #ff4d4d;
    --text-hi:    #e8f4ff;
    --text-mid:   #7da8cc;
    --text-lo:    #3a5a78;
    --selected-bg: rgba(0,200,255,0.12);
    --selected-border: #00c8ff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    height: 100vh;
}

/* ─── SIDEBAR ─────────────────────────────────────────── */
#sidebar {
    position: relative;
    width: 240px;
    min-width: 240px;
    display: flex;
    flex-direction: column;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    z-index: 200;
    overflow: hidden;
}

/* subtle grid texture */
#sidebar::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.25;
    pointer-events: none;
}

/* ─── HEADER ─────────────────────────────────────────── */
.sidebar-header {
    position: relative;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.sidebar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
}

.sidebar-logo-icon {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--cyan), var(--cyan-dim));
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    box-shadow: 0 0 10px rgba(0,200,255,0.3);
    flex-shrink: 0;
}

.sidebar-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-hi);
    letter-spacing: 1px;
    text-transform: uppercase;
    line-height: 1;
}

.sidebar-sub {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-lo);
    letter-spacing: 2px;
    margin-top: 4px;
}

/* ─── SCROLL BODY ─────────────────────────────────────── */
.sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.sidebar-body::-webkit-scrollbar { width: 4px; }
.sidebar-body::-webkit-scrollbar-track { background: transparent; }
.sidebar-body::-webkit-scrollbar-thumb { background: var(--border-lit); border-radius: 2px; }

/* ─── SECTION LABELS ─────────────────────────────────── */
.section-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-lo);
    padding: 0 4px;
    margin-top: 4px;
}

/* ─── UPLOAD CARDS ─────────────────────────────────────── */
.upload-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
    height: 54px;          /* fixed height — never grows */
    flex-shrink: 0;        /* never shrinks inside sidebar */
    min-height: 54px;
}

.upload-card:hover {
    border-color: var(--border-lit);
    background: var(--bg-hover);
    box-shadow: 0 0 12px rgba(0,200,255,0.08);
}

.upload-card.loaded {
    border-color: var(--green-dim);
    background: rgba(0, 230, 118, 0.05);
}

.upload-card.loaded:hover {
    border-color: var(--green);
    box-shadow: 0 0 12px rgba(0,230,118,0.1);
}

.upload-card-icon {
    width: 32px;
    height: 32px;
    min-width: 32px;   /* never squeezes */
    border-radius: 6px;
    background: var(--bg-deep);
    border: 1px solid var(--border-lit);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    transition: border-color 0.2s;
}

.upload-card.loaded .upload-card-icon {
    border-color: var(--green-dim);
}

.upload-card-info {
    flex: 1;
    min-width: 0;        /* allow text truncation */
    overflow: hidden;    /* clip any overflow */
}

.upload-card-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-hi);
    letter-spacing: 0.5px;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.upload-card-filename {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-lo);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.2s;
}

.upload-card.loaded .upload-card-filename {
    color: var(--green);
}

.upload-card-status {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-lo);
    flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
}

.upload-card.loaded .upload-card-status {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
}

/* ─── RESET BUTTON ─────────────────────────────────────── */
.reset-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 9px 0;
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--cyan-dim);
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
}

.reset-btn:hover {
    background: var(--cyan-glow);
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0,200,255,0.2);
}

/* ─── DIVIDER ─────────────────────────────────────────── */
.divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2px 0;
}

/* ─── LEGEND ─────────────────────────────────────────── */
#legend {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.legend-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
}

.legend-title {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-lo);
}

.legend-count-total {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--cyan-dim);
}

.legend-empty {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-lo);
    text-align: center;
    padding: 16px 8px;
    line-height: 1.6;
}

.empty-slot-note {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11px;
    color: var(--text-mid);
}

.empty-slot-swatch {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    background: #cccccc;
    border: 1px solid #888;
    flex-shrink: 0;
}

/* ─── LEGEND ROWS ─────────────────────────────────────── */
.legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    position: relative;
}

.legend-row:hover {
    background: var(--bg-hover);
    border-color: var(--border);
}

.legend-row.selected {
    background: var(--selected-bg);
    border-color: var(--selected-border);
    box-shadow: 0 0 0 1px rgba(0,200,255,0.1), inset 0 0 12px rgba(0,200,255,0.06);
}

.legend-row.selected::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--cyan);
    border-radius: 6px 0 0 6px;
    box-shadow: 0 0 8px var(--cyan);
}

.color-box {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
    transition: box-shadow 0.2s;
}

.legend-row.selected .color-box {
    box-shadow: 0 0 6px currentColor;
}

.legend-name {
    flex: 1;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-mid);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.15s;
    letter-spacing: 0.3px;
}

.legend-row.selected .legend-name {
    color: var(--text-hi);
    font-weight: 600;
}

.count-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-lo);
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1px 7px;
    flex-shrink: 0;
    transition: color 0.15s, border-color 0.15s;
}

.legend-row.selected .count-badge {
    color: var(--cyan);
    border-color: var(--cyan-dim);
}

/* ─── SIDEBAR FOOTER / STATUS ─────────────────────────── */
.sidebar-footer {
    border-top: 1px solid var(--border);
    padding: 8px 12px;
    flex-shrink: 0;
}

#status {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-lo);
    letter-spacing: 0.5px;
    line-height: 1.5;
}

#status .stat-hi { color: var(--cyan); font-weight: 500; }
#status .stat-ok { color: var(--green); }
#status .stat-warn { color: var(--amber); }

.front-badge { color: var(--green); font-weight: bold; }
.back-badge  { color: var(--amber); font-weight: bold; }
</style>
</head>
<body>

<div id="sidebar">
    <!-- Header -->
    <div class="sidebar-header">
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">🏭</div>
            <div class="sidebar-title">DEMO</div>
        </div>
        <div class="sidebar-sub">WAREHOUSE · 3D VIEW</div>
    </div>

    <!-- Scrollable body -->
    <div class="sidebar-body">

        <!-- File uploads -->
        <div class="section-label">Data Sources</div>

        <div class="upload-card" id="locCard">
            <div class="upload-card-icon">🗂️</div>
            <div class="upload-card-info">
                <div class="upload-card-label">Locations</div>
                <div class="upload-card-filename" id="locFileName">Click to load .xlsx</div>
            </div>
            <div class="upload-card-status"></div>
            <input type="file" id="locFile" accept=".xlsx" style="display:none;">
        </div>

        <div class="upload-card" id="csvCard">
            <div class="upload-card-icon">📋</div>
            <div class="upload-card-info">
                <div class="upload-card-label">DEMO Inventory</div>
                <div class="upload-card-filename" id="fileName">Click to load .csv</div>
            </div>
            <div class="upload-card-status"></div>
            <input type="file" id="csvFile" accept=".csv" style="display:none;">
        </div>

        <!-- Reset -->
        <button id="resetBtn" class="reset-btn">
            <span>⟳</span><span>Show All</span>
        </button>

        <hr class="divider">

        <!-- Legend -->
        <div id="legend">
            <div class="legend-header">
                <span class="legend-title">Customers</span>
                <span class="legend-count-total" id="legendTotal"></span>
            </div>
            <div class="legend-empty">Upload DEMO.csv<br>to see customer data</div>
        </div>

    </div>

    <!-- Footer status -->
    <div class="sidebar-footer">
        <div id="status">⏳ Ready — load Locations.xlsx first</div>
    </div>
</div>

    // Front area K-S  (same X as first 6 groups of A-Z6)
    'K':  1,  'L': 3,  'M':  4,
    'N':  6,  'X': 7,  'O':  9, 'P': 10,

    'H': 12,  'I': 13, 'J': 15,
    'LL': 17, 'MM': 18,
    'NN': 20, 'OO': 21,
    'PP': 23, 'QQ': 24,
    'RR': 26, 'SS': 27,
    'TT': 29, 'UU': 30,
    'VV': 32, 'WW': 33,
    'XX': 35, 'YY': 36,
    'Z1': 38, 'Z2': 39,
    'Z3': 41, 'Z4': 42,

    { type: 'pair', names: ['VV', 'WW'] },
    { type: 'pair', names: ['XX', 'YY'] },

// FRONT AREA row definitions (K-S)

// Rack parameters

const CUBE_HEIGHT = 8.0;
const CUBE_DEPTH = 8.0;

// X_SCALE: each spreadsheet column unit → world X units
// Within a pair cols are adjacent (delta=1), between groups delta=2 (1 gap col)
const X_SCALE = 13.0;

const BAY_SPACING = CUBE_DEPTH; // No gap between bays — cubes sit flush
const LEVEL_SPACING = 8.0;     // Distance between levels (height)
const AREA_GAP = 60.0;         // Gap in Z between K-S and A-Z6

const MAX_BAY = 24;
const MAX_LEVEL = 7;

// K-S bay 1 starts at this Z; bays go deeper (larger Z) toward back
const Z_FRONT_START = 50.0;
// A-Z6 bay 1 starts after K-S max bay + gap
const KS_MAX_BAY   = 10;
const Z_BACK_START = Z_FRONT_START + KS_MAX_BAY * BAY_SPACING + AREA_GAP;

// Empty slot color
const EMPTY_COLOR = 0xcccccc;

const rowMaxData = new Map();

// ---------------- DATA STRUCTURES ----------------

const customerColors = {};
const customerCount = {};
const locationMap = new Map();
const cubes = [];

let selectedCube = null;

function getCustomerColor(customer) {
    if (!customer) return EMPTY_COLOR;
    
    if (!customerColors[customer]) {
        let hash = 0;
        for (let i = 0; i < customer.length; i++) {
            hash = ((hash << 5) - hash) + customer.charCodeAt(i);
            hash = hash & hash;
        }
        
        const r = ((hash & 0xFF0000) >> 16) / 255;
        const g = ((hash & 0x00FF00) >> 8) / 255;
        const b = (hash & 0x0000FF) / 255;
        
        const color = new THREE.Color(r * 0.7 + 0.3, g * 0.7 + 0.3, b * 0.7 + 0.3);
        customerColors[customer] = color;
    }
    
    return customerColors[customer];
}

// ---------------- CREATE CUBE WITH BORDER ----------------

function createRackCube(color, isOccupied, cubeH) {
    const h = cubeH || CUBE_HEIGHT;
    const group = new THREE.Group();

    const mainGeo = new THREE.BoxGeometry(CUBE_WIDTH - 0.2, h - 0.2, CUBE_DEPTH - 0.2);
    const mainMat = new THREE.MeshStandardMaterial({
        color: isOccupied ? color : 0xffffff,
        transparent: true,
        opacity: isOccupied ? 0.95 : 0.0,   // fully transparent when empty
        emissive: isOccupied ? 0x111111 : 0x000000,
        roughness: 0.4,
        metalness: 0.1,
        depthWrite: isOccupied,              // don't write depth for transparent slots
    });
    const mainCube = new THREE.Mesh(mainGeo, mainMat);
    mainCube.castShadow = isOccupied;
    mainCube.receiveShadow = true;
    group.add(mainCube);

    // Edge outline — subtle for empty, invisible when occupied (color fills instead)
    // All edges use the same unified dim color — empty and occupied look identical at rest
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.45 });
    const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(CUBE_WIDTH, h, CUBE_DEPTH));
    const line = new THREE.LineSegments(edges, edgeMat);
    group.add(line);

    return group;
}

// ---------------- FLOOR LABEL SYSTEM ----------------

const floorLabels = [];

function createFloorLabel(text, x, z, bgColor, textColor) {
    const canvas = document.createElement('canvas');
    const fontSize = 28;
    // Measure text width first using a temp canvas
    const tmp = document.createElement('canvas').getContext('2d');
    tmp.font = `bold ${fontSize}px Arial`;
    const textW = tmp.measureText(text).width;
    const padX = 16, padY = 10;
    canvas.width  = Math.ceil(textW + padX * 2);
    canvas.height = Math.ceil(fontSize + padY * 2);
    const ctx = canvas.getContext('2d');

    // Background pill
    const r = 8;
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = bgColor || 'rgba(30,60,100,0.92)';
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(w-r, 0);
    ctx.arcTo(w, 0, w, r, r);
    ctx.lineTo(w, h-r);
    ctx.arcTo(w, h, w-r, h, r);
    ctx.lineTo(r, h);
    ctx.arcTo(0, h, 0, h-r, r);
    ctx.lineTo(0, r);
    ctx.arcTo(0, 0, r, 0, r);
    ctx.closePath();
    ctx.fill();

    // Border
    ctx.strokeStyle = textColor || '#88ccff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Text
    ctx.fillStyle = textColor || '#ffffff';
    ctx.font = `bold ${fontSize}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, w / 2, h / 2);

    const texture = new THREE.CanvasTexture(canvas);
    const aspect = canvas.width / canvas.height;
    const planeH = 10;
    const planeW = aspect * planeH;
    const geo  = new THREE.PlaneGeometry(planeW, planeH);
    const mat  = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(x, 0.5, z);
    return mesh;
}

function buildLabels() {
    // Remove old labels
    floorLabels.forEach(l => scene.remove(l));
    floorLabels.length = 0;

    // For each aisle group, compute center X and place label just in front of bay-1
    const FRONT_LABEL_Z  = Z_FRONT_START - 10;   // In front of K-S bay 1
    const BACK_LABEL_Z   = Z_BACK_START  - 10;   // In gap before A-Z6 bay 1

    const FRONT_BG = 'rgba(20,80,40,0.92)';
    const FRONT_TC = '#88ffaa';
    const BACK_BG  = 'rgba(80,50,10,0.92)';
    const BACK_TC  = '#ffcc66';

    function addLabel(text, colIdx, z, bg, tc) {
        const x = (46 - colIdx) * X_SCALE;
        const mesh = createFloorLabel(text, x, z, bg, tc);
        scene.add(mesh);
        floorLabels.push(mesh);
    }

    // --- FRONT AREA K-S labels ---
    frontAreaRows.forEach(row => {
        if (row.type === 'single') {
            addLabel(row.name, ROW_COL_INDEX[row.name], FRONT_LABEL_Z, FRONT_BG, FRONT_TC);
        } else {
            // Place two labels side-by-side or a combined label at midpoint
            const c0 = ROW_COL_INDEX[row.names[0]];
            const c1 = ROW_COL_INDEX[row.names[1]];
            addLabel(row.names[0], c0, FRONT_LABEL_Z, FRONT_BG, FRONT_TC);
            addLabel(row.names[1], c1, FRONT_LABEL_Z, FRONT_BG, FRONT_TC);
        }
    });

    // --- BACK AREA A-Z6 labels ---
    backAreaRows.forEach(row => {
        if (row.type === 'single') {
            addLabel(row.name, ROW_COL_INDEX[row.name], BACK_LABEL_Z, BACK_BG, BACK_TC);
        } else {
            const c0 = ROW_COL_INDEX[row.names[0]];
            const c1 = ROW_COL_INDEX[row.names[1]];
            addLabel(row.names[0], c0, BACK_LABEL_Z, BACK_BG, BACK_TC);
            addLabel(row.names[1], c1, BACK_LABEL_Z, BACK_BG, BACK_TC);
        }
    });
}

// ---------------- BUILD RACK FUNCTION ----------------

function buildRack() {
    cubes.forEach(cube => scene.remove(cube));
    cubes.length = 0;

    document.getElementById('legend').innerHTML = '<b>📊 Customer Legend</b><hr>';
    Object.keys(customerCount).forEach(key => delete customerCount[key]);

    let totalOccupied = 0;

    // Helper: place cubes for one zone (row name).
    // X = mirrored column position (aisle left-right)
    // Z = zOffset + bay * BAY_SPACING  (depth into warehouse)
    // Y = level * levelSpacing         (height, scaled so ALL racks share same top)
    //
    // Formula: levelSpacing = (MAX_LEVEL * LEVEL_SPACING) / maxLevel
    //   7-level rack: spacing = 8.0  → top at 7×8  = 56
    //   6-level rack: spacing = 9.33 → top at 6×9.33 = 56
    //   5-level rack: spacing = 11.2 → top at 5×11.2 = 56
    function buildZone(zone, zOffset, area) {
        const colIdx = ROW_COL_INDEX[zone];
        if (colIdx === undefined) return;
        const xPos = (46 - colIdx) * X_SCALE;

        const rmd = rowMaxData.get(zone) || { maxBay: MAX_BAY, maxLevel: MAX_LEVEL };

        // Scale so top level always sits at MAX_LEVEL * LEVEL_SPACING
        const levelSpacing = (MAX_LEVEL * LEVEL_SPACING) / rmd.maxLevel;
        const cubeH = levelSpacing;

        for (let bay = 1; bay <= rmd.maxBay; bay++) {
            for (let level = 1; level <= rmd.maxLevel; level++) {
                const locationKey = `${zone}-${level}-${bay}`;
                if (validLocations.size > 0 && !validLocations.has(locationKey)) continue;

                const customer = locationMap.get(locationKey);
                const color = customer ? getCustomerColor(customer) : EMPTY_COLOR;
                if (customer) {
                    customerCount[customer] = (customerCount[customer] || 0) + 1;
                    totalOccupied++;
                }

                const cubeGroup = createRackCube(color, !!customer, cubeH);
                cubeGroup.position.set(xPos, level * levelSpacing, zOffset + bay * BAY_SPACING);
                cubeGroup.userData = {
                    location: locationKey,
                    customer: customer || null,
                    zone, level, bay,
                    isOccupied: !!customer,
                    area,
                    rowType: 'zone'
                };
                scene.add(cubeGroup);
                cubes.push(cubeGroup);
            }
        }
    }

    // ============ BUILD FRONT AREA (K-S) ============
    frontAreaRows.forEach(row => {
        if (row.type === 'single') {
            buildZone(row.name, Z_FRONT_START, 'FRONT AREA (K-S)');
        } else {
            row.names.forEach(zone => buildZone(zone, Z_FRONT_START, 'FRONT AREA (K-S)'));
        }
    });

    // ============ BUILD BACK AREA (A-Z6) ============
    backAreaRows.forEach(row => {
        if (row.type === 'single') {
            buildZone(row.name, Z_BACK_START, 'BACK AREA (A-Z6)');
        } else {
            row.names.forEach(zone => buildZone(zone, Z_BACK_START, 'BACK AREA (A-Z6)'));
        }
    });

    // Update legend
    updateLegend();
    buildLabels();

    document.getElementById('status').innerHTML =
        `<span class="stat-hi">${totalOccupied.toLocaleString()}</span> occupied &nbsp;·&nbsp; ${cubes.length.toLocaleString()} slots &nbsp;·&nbsp; <span class="front-badge">K-S</span> <span class="stat-ok">▶</span> <span class="back-badge">A-Z6</span>`;
}

// ---------------- UPDATE LEGEND ----------------

function updateLegend() {
    const legendDiv = document.getElementById('legend');

    const sortedCustomers = Object.entries(customerCount).sort((a, b) => b[1] - a[1]);
    const totalSlots = cubes.length;
    const totalOcc = sortedCustomers.reduce((s, [, c]) => s + c, 0);

    legendDiv.innerHTML = `
        <div class="legend-header">
            <span class="legend-title">Customers</span>
            <span class="legend-count-total" id="legendTotal">${sortedCustomers.length} customers</span>
        </div>`;

    if (sortedCustomers.length === 0) {
        legendDiv.innerHTML += `<div class="legend-empty">Upload DEMO.csv<br>to see customer data</div>`;
        return;
    }

    // Empty slot note
    const emptyNote = document.createElement('div');
    emptyNote.className = 'empty-slot-note';
    emptyNote.innerHTML = '<div class="empty-slot-swatch"></div><span>Light gray = empty slot</span>';
    legendDiv.appendChild(emptyNote);

    // Customer rows
    sortedCustomers.forEach(([customer, count]) => {
        const row = document.createElement('div');
        row.className = 'legend-row' + (selectedCustomers.has(customer) ? ' selected' : '');

        const hex = '#' + customerColors[customer].getHexString();
        const colorBox = document.createElement('div');
        colorBox.className = 'color-box';
        colorBox.style.backgroundColor = hex;
        if (selectedCustomers.has(customer)) {
            colorBox.style.boxShadow = `0 0 6px ${hex}`;
        }

        const nameSpan = document.createElement('span');
        nameSpan.className = 'legend-name';
        nameSpan.textContent = customer.length > 22 ? customer.substring(0, 20) + '…' : customer;
        nameSpan.title = customer;

        const countBadge = document.createElement('span');
        countBadge.className = 'count-badge';
        countBadge.textContent = count.toLocaleString();

        row.appendChild(colorBox);
        row.appendChild(nameSpan);
        row.appendChild(countBadge);

        row.addEventListener('click', () => {
            highlightCustomer(customer);
            updateLegend();
        });

        legendDiv.appendChild(row);
    });
}

// ---------------- MULTI-SELECTION HANDLING ----------------

// track which customers are currently selected
const selectedCustomers = new Set();

function updateHighlights() {
    if (selectedCustomers.size === 0) {
        resetHighlight();
        return;
    }

    cubes.forEach(cubeGroup => {
        const isSelected = selectedCustomers.has(cubeGroup.userData.customer);
        cubeGroup.children.forEach(child => {
            if (child.isLineSegments) {
                // Edges: bright on selected, same dim for everything else (empty + unselected)
                child.material.opacity = isSelected ? 0.9 : 0.45;
                child.material.color.setHex(isSelected ? 0x444444 : 0x888888);
            } else if (child.isMesh) {
                if (isSelected) {
                    child.material.opacity = 1.0;
                    child.material.emissive.setHex(0x333333);
                } else {
                    child.material.opacity = 0.0;
                    child.material.emissive.setHex(0x000000);
                }
            }
        });
    });
}

function highlightCustomer(customer) {
    // toggle this customer in the set
    if (selectedCustomers.has(customer)) {
        selectedCustomers.delete(customer);
    } else {
        selectedCustomers.add(customer);
    }
    updateHighlights();
}

window.resetHighlight = function() {
    selectedCustomers.clear();
    updateLegend();

    cubes.forEach(cubeGroup => {
        cubeGroup.children.forEach(child => {
            if (child.isLineSegments) {
                // Always restore to the same unified dim border
                child.material.opacity = 0.45;
                child.material.color.setHex(0x888888);
            } else if (child.isMesh) {
                child.material.opacity = cubeGroup.userData.isOccupied ? 0.95 : 0.0;
                child.material.emissive.setHex(0x000000);
            }
        });
    });
};

    }

// ---------------- LOCATIONS XLSX PARSING ----------------

function parseLocationsXlsx(file) {
    document.getElementById('status').innerHTML = '⏳ Parsing Locations.xlsx…';
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
            
            validLocations.clear();
            rowMaxData.clear();
            
            // Collect per-row stats while scanning all cells
            const rowStats = new Map(); // rowName -> { maxBay, maxLevel }
            
            // Skip header row (index 0)
            for (let r = 1; r < rows.length; r++) {
                for (let c = 0; c < rows[r].length; c++) {
                    const cell = rows[r][c];
                    if (!cell || typeof cell !== 'string') continue;
                    const val = cell.trim();
                    if (!val || !val.includes('-')) continue;
                    
                    // Parse location: last part = bay, second-to-last = level, rest = row name
                    const parts = val.split('-');
                    if (parts.length < 3) continue;
                    
                    const bay = parseInt(parts[parts.length - 1]);
                    const level = parseInt(parts[parts.length - 2]);
                    if (isNaN(bay) || isNaN(level)) continue;
                    
                    const rowName = parts.slice(0, parts.length - 2).join('-');
                    if (!rowName) continue;
                    
                    validLocations.add(val);
                    
                    if (!rowStats.has(rowName)) rowStats.set(rowName, { maxBay: 0, maxLevel: 0 });
                    const rs = rowStats.get(rowName);
                    if (bay > rs.maxBay) rs.maxBay = bay;
                    if (level > rs.maxLevel) rs.maxLevel = level;
                }
            }
            
            rowStats.forEach((stats, rowName) => {
                rowMaxData.set(rowName, stats);
            });
            
            console.log(`Parsed ${validLocations.size} valid locations across ${rowMaxData.size} rows`);
            document.getElementById('status').innerHTML = 
                `<span class="stat-ok">✓</span> <span class="stat-hi">${validLocations.size.toLocaleString()}</span> slots · <span class="stat-hi">${rowMaxData.size}</span> rows loaded`;
            
            buildRack();
        } catch (err) {
            console.error('XLSX parsing error:', err);
            document.getElementById('status').innerHTML = `<span style="color:var(--red)">✕ XLSX error: ${err.message}</span>`;
        }
    };
    reader.readAsArrayBuffer(file);
}

// ---------------- CSV PARSING ----------------

function parseCSV(file) {
    Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            locationMap.clear();
            
            results.data.forEach(row => {
                const location = row['Location'];
                const ownerName = row['Owner Name'];
                
                if (location && ownerName && !location.includes('TEMP')) {
                    const cleanLocation = location.trim();
                    locationMap.set(cleanLocation, ownerName.trim());
                }
            });
            
            console.log(`Parsed ${locationMap.size} unique locations`);
            document.getElementById('status').innerHTML = 
                `<span class="stat-ok">✓</span> <span class="stat-hi">${locationMap.size.toLocaleString()}</span> inventory records loaded`;
            
            buildRack();
        },
        error: function(error) {
            console.error('CSV parsing error:', error);
            document.getElementById('status').innerHTML = `<span style="color:var(--red)">✕ CSV parse error</span>`;
        }
    });
}

    if (!file) return;
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('csvCard').classList.add('loaded');
    document.getElementById('status').textContent = '⏳ Parsing CSV…';
    parseCSV(file);
});

// ---------------- ANIMATION ----------------

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

// ---------------- INITIAL BUILD FROM EMBEDDED DATA ----------------

function loadEmbeddedData() {
    // Load locations from embedded JSON
    validLocations.clear();
    rowMaxData.clear();

    EMBEDDED_LOCATIONS.validLocations.forEach(loc => validLocations.add(loc));
    Object.entries(EMBEDDED_LOCATIONS.rowMaxData).forEach(([row, data]) => {
        rowMaxData.set(row, data);
    });

    // Load demo inventory from embedded JSON
    locationMap.clear();
    Object.entries(EMBEDDED_INVENTORY).forEach(([loc, owner]) => {
        locationMap.set(loc, owner);
    });

    // Mark both cards as loaded
    document.getElementById('locCard').classList.add('loaded');
    document.getElementById('locFileName').textContent = 'Locations.xlsx (built-in)';
    document.getElementById('csvCard').classList.add('loaded');
    document.getElementById('fileName').textContent = 'Demo.csv (built-in)';

    buildRack();

    document.getElementById('status').innerHTML =
        `<span class="stat-ok">✓</span> Demo loaded — <span class="stat-hi">${validLocations.size.toLocaleString()}</span> slots · <span class="stat-hi">${Object.keys(EMBEDDED_INVENTORY).length.toLocaleString()}</span> occupied`;
}

loadEmbeddedData();

console.log('DEMO Warehouse Rack Simulator initialized');
</script>
</body>
</html>
